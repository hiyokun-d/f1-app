<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Checkered tile pattern for right panel -->
    <pattern id="checker" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#1a1a1a"/>
      <rect x="20" y="0" width="20" height="20" fill="#111111"/>
      <rect x="0" y="20" width="20" height="20" fill="#111111"/>
      <rect x="20" y="20" width="20" height="20" fill="#1a1a1a"/>
    </pattern>
    <!-- Radial glow for car icon -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8002d" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#e8002d" stop-opacity="0"/>
    </radialGradient>
    <!-- Left-to-right fade mask on checker panel -->
    <linearGradient id="checkerFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d0d0d" stop-opacity="1"/>
      <stop offset="30%" stop-color="#0d0d0d" stop-opacity="0"/>
    </linearGradient>
    <!-- Vertical red gradient for left accent bar -->
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff2b4a"/>
      <stop offset="100%" stop-color="#9b0020"/>
    </linearGradient>
  </defs>

  <!-- Base background -->
  <rect width="1200" height="630" fill="#0d0d0d"/>

  <!-- Right panel: checkered texture -->
  <rect x="580" y="0" width="620" height="630" fill="url(#checker)"/>
  <!-- Fade checker into dark on the left edge -->
  <rect x="580" y="0" width="620" height="630" fill="url(#checkerFade)"/>

  <!-- Glow behind car icon -->
  <ellipse cx="960" cy="315" rx="280" ry="200" fill="url(#glow)"/>

  <!-- Car icon (viewBox 0 0 24 24 → scaled ~18× → ~432px wide, centered right panel) -->
  <g transform="translate(740, 170) scale(18)">
    <path fill="#e8002d" opacity="0.9" d="M12 8.5H7L4 11H3c-1.11 0-2 .89-2 2v3h2.17c.43 1.2 1.56 2 2.83 2s2.4-.8 2.82-2h6.35c.43 1.2 1.56 2 2.83 2s2.4-.8 2.82-2H23v-1c0-1.11-1.03-1.47-2-2zM5.25 12l2.25-2h4l4 2zM6 13.5A1.5 1.5 0 0 1 7.5 15A1.5 1.5 0 0 1 6 16.5A1.5 1.5 0 0 1 4.5 15A1.5 1.5 0 0 1 6 13.5m12 0a1.5 1.5 0 0 1 1.5 1.5a1.5 1.5 0 0 1-1.5 1.5a1.5 1.5 0 0 1-1.5-1.5a1.5 1.5 0 0 1 1.5-1.5"/>
  </g>

  <!-- Shadow under car -->
  <ellipse cx="958" cy="500" rx="200" ry="18" fill="#000" opacity="0.5"/>

  <!-- Helmet icon top-right, ghosted -->
  <g transform="translate(1040, 40) scale(6)" opacity="0.18">
    <path fill="#e8002d" d="M2.2 11.2c-.2 2.4.5 4.4 2 6.2S7.7 20 10.1 20h10c.5 0 1-.2 1.4-.6s.6-.9.6-1.4v-.8c0-.6-.1-1.3-.2-2.2h-8.2c-1 0-1.8-.4-2.5-1.1s-1.1-1.6-1.1-2.5c0-1.6.7-2.7 2.2-3.3L17.1 6c-1.7-1.2-3.7-1.9-6-2c-2.2-.2-4.2.5-6 1.9S2.4 9 2.2 11.2m9.9.2c0 .4.2.8.5 1.1s.7.5 1.1.5h7.8c-.6-2.2-1.5-4-2.8-5.4l-5.6 2.3c-.7.2-1 .7-1 1.5"/>
  </g>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="6" height="630" fill="url(#barGrad)"/>

  <!-- Red speed lines (motion blur effect behind car) -->
  <g opacity="0.12" fill="#e8002d">
    <rect x="640" y="290" width="180" height="3" rx="1.5"/>
    <rect x="620" y="305" width="200" height="2" rx="1"/>
    <rect x="650" y="318" width="160" height="2" rx="1"/>
    <rect x="630" y="330" width="190" height="3" rx="1.5"/>
    <rect x="660" y="343" width="140" height="2" rx="1"/>
  </g>

  <!-- Main text: RACE -->
  <text
    x="72" y="270"
    font-family="Helvetica Neue, Arial Black, Arial, sans-serif"
    font-weight="900"
    font-size="148"
    fill="#ffffff"
    letter-spacing="-4">RACE</text>

  <!-- Red underline under RACE -->
  <rect x="72" y="282" width="380" height="5" rx="2.5" fill="#e8002d"/>

  <!-- Main text: CENTER -->
  <text
    x="68" y="418"
    font-family="Helvetica Neue, Arial Black, Arial, sans-serif"
    font-weight="900"
    font-size="148"
    fill="#e8002d"
    letter-spacing="-4">CENTER</text>

  <!-- Divider line -->
  <rect x="72" y="450" width="500" height="1" fill="rgba(255,255,255,0.12)"/>

  <!-- Tagline -->
  <text
    x="76" y="488"
    font-family="Helvetica Neue, Arial, sans-serif"
    font-weight="400"
    font-size="22"
    fill="rgba(255,255,255,0.45)"
    letter-spacing="4">F1 LIVE TRACKER · POWERED BY OPENF1</text>

  <!-- CTA button -->
  <rect x="72" y="514" width="240" height="52" rx="6" fill="#e8002d"/>
  <text
    x="192" y="547"
    font-family="Helvetica Neue, Arial, sans-serif"
    font-weight="700"
    font-size="20"
    fill="white"
    letter-spacing="2"
    text-anchor="middle">WATCH LIVE →</text>

  <!-- Bottom bar -->
  <rect x="0" y="604" width="1200" height="26" fill="#e8002d" opacity="0.9"/>

  <!-- Checkered flag mini icon in bottom bar -->
  <g transform="translate(20, 607) scale(0.9)">
    <path fill="white" d="M14.4 6H20v10h-7l-.4-2H7v7H5V4h9zm-.4 8h2v-2h2v-2h-2V8h-2v2l-1-2V6h-2v2H9V6H7v2h2v2H7v2h2v-2h2v2h2v-2l1 2zm-3-4V8h2v2zm3 0h2v2h-2z"/>
  </g>
  <text x="50" y="622" font-family="Helvetica Neue, Arial, sans-serif" font-weight="600" font-size="14" fill="white" letter-spacing="3" opacity="0.9">RACE-CENTER.APP</text>
</svg>
