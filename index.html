<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Race Center — F1 Live Tracker</title>
    <meta
      name="description"
      content="Real-time Formula 1 race viewer. Live standings, driver telemetry, track map, team radio, and full replay — powered by the OpenF1 public API."
